    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

    <script>
        window.addEventListener('load', function () {
            // 1) If you need the "customer" query param, parse it here:
            const iframeUrl = new URL(window.location.href);
            const customerId = iframeUrl.searchParams.get('customer') || 'Unknown';

            // 2) Optionally, set GA user property (if you're using GA4):
            if (typeof gtag === 'function') {
                gtag('set', { 'user_id': customerId });
                console.log('GA user_id set to:', customerId);
            }

            // 3) Get all <img> elements in the document.
            const allImages = document.querySelectorAll('img');

            // 4) Loop through each <img> and attach event listeners
            allImages.forEach(function (img) {

                // If an <img> doesn't have an ID, skip it.
                if (!img.id) return;

                // ---- A) postMessage logic ----
                img.addEventListener('click', function () {
                    window.top.postMessage({
                        openArticleList: {
                            uniSearch: {
                                query: img.id  // Use the <img> ID as the query
                            }
                        }
                    }, '*');
                });

                // ---- B) Google Analytics event logic ----
                if (typeof gtag === 'function') {
                    img.addEventListener('click', function () {
                        gtag('event', 'click', {
                            'event_category': 'landing page',
                            'event_label': 'Click on ' + img.id + ' banner',
                            'customer_id': customerId
                        });
                    });
                }
            });
        });
    </script>
