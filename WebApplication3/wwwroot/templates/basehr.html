<!-- JavaScript for Responsiveness -->
<script>
    // <![CDATA[
    function adjustMenu() {
        const menu = document.querySelector('.horizontal-menu');
        const links = document.querySelectorAll('.horizontal-menu a');

        if (window.innerWidth <= 768) {
            menu.style.flexDirection = 'column';
            menu.style.padding = '20px';
            menu.style.textAlign = 'center';

            links.forEach(link => {
                link.style.padding = '10px 10px';
            });
        } else {
            menu.style.flexDirection = 'row';
            menu.style.padding = '20px 5px';
            menu.style.textAlign = 'initial';

            links.forEach(link => {
                link.style.padding = '10px 10px';
            });
        }
    }

    // Run on load
    window.onload = adjustMenu;

    // Run on window resize
    window.onresize = adjustMenu;
    // ]]></script>

<script>
    // <![CDATA[
    // Select all links with the class "submitLink"
    const links = document.querySelectorAll('.submitLink');

    // Loop through each link and add event listeners for hover effect
    links.forEach(link => {
        link.addEventListener('mouseover', () => {
            link.style.backgroundColor = '#FFFFFF'; // White background
            link.style.color = '#FF0000'; // Red text
        });

        link.addEventListener('mouseout', () => {
            link.style.backgroundColor = '#FF0000'; // Red background
            link.style.color = '#FFFFFF'; // White text
        });
    });

<!-- JavaScript για εναλλαγή προβολής -->
<script>
    // <![CDATA[
    function toggleDetails(jobId) {
        const details = document.getElementById(jobId);
        const summary = details.previousElementSibling;
        const allDetails = document.querySelectorAll('.job-details');
        const allSummaries = document.querySelectorAll('.job-summary');

        // Reset all other job summaries and details
        allDetails.forEach((detail) => {
            if (detail.id !== jobId) {
                detail.style.display = 'none';
                detail.previousElementSibling.style.boxShadow = '0px 4px 8px rgba(0, 0, 0, 0.2)';
                detail.previousElementSibling.style.backgroundColor = '#cbcbcb'; // Reset background color
            }
        });

        allSummaries.forEach((summary) => {
            summary.querySelector('.expand-icon').textContent = '+';
        });

        // Toggle the selected job details and summary styles
        if (details.style.display === 'none' || details.style.display === '') {
            details.style.display = 'block';
            summary.style.boxShadow = '0px 4px 8px rgba(0, 0, 0, 0.4)'; // Grey shadow when minimized
            summary.querySelector('.expand-icon').textContent = '−';
            summary.style.backgroundColor = '#98989f'; // New color for selected job post
        } else {
            details.style.display = 'none';
            summary.style.boxShadow = '0px 4px 8px rgba(0, 0, 0, 0.2)'; // Grey shadow when minimized
            summary.querySelector('.expand-icon').textContent = '+';
            summary.style.backgroundColor = '#cbcbcb'; // Reset color when collapsed
        }
    }
    // ]]></script>
